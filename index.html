<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ciclo de Estudos Sequencial</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #f8fafc;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --success: #10b981;
      --danger: #ef4444;
      --muted: #64748b;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: var(--bg); color: var(--text); display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 20px; }
    
    .container { width: 100%; max-width: 500px; display: flex; flex-direction: column; gap: 20px; }
    header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--muted); padding-bottom: 10px; }
    h1 { font-size: 1.2rem; font-weight: 600; color: var(--muted); }
    
    .btn-icon { background: none; border: 1px solid var(--muted); color: var(--text); padding: 6px 12px; border-radius: 6px; cursor: pointer; }
    .btn-icon:hover { background: var(--card-bg); }

    /* Estilos da View Principal */
    .main-card { background: var(--card-bg); padding: 30px 20px; border-radius: 16px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 15px; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3); }
    .tag { background: #334155; color: #94a3b8; font-size: 0.8rem; padding: 4px 12px; border-radius: 20px; text-transform: uppercase; letter-spacing: 1px; }
    .current-title { font-size: 1.8rem; font-weight: 700; min-height: 2.2rem; }
    .current-desc { color: #94a3b8; font-size: 0.95rem; min-height: 1.2rem; }
    
    /* Botão Deslizante (Slide to Complete) */
    .swipe-container {
      position: relative;
      width: 100%;
      height: 60px;
      background: #0f172a;
      border-radius: 30px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid #334155;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
      margin-top: 15px;
    }

    .swipe-text {
      color: var(--muted);
      font-size: 0.9rem;
      font-weight: 600;
      letter-spacing: 1px;
      pointer-events: none;
    }

    .swipe-handle {
      position: absolute;
      left: 4px;
      top: 4px;
      width: 52px;
      height: 52px;
      background: var(--accent);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: bold;
      cursor: grab;
      box-shadow: 0 2px 8px rgba(0,0,0,0.4);
      transition: background 0.2s;
    }

    .swipe-handle:active {
      cursor: grabbing;
    }

    .next-up { font-size: 0.85rem; color: var(--muted); margin-top: 10px; }

    /* Painel de Configurações (Oculto por padrão) */
    .config-panel { display: none; background: var(--card-bg); padding: 20px; border-radius: 16px; flex-direction: column; gap: 15px; }
    .config-panel.open { display: flex; }
    
    .form-group { display: flex; flex-direction: column; gap: 5px; }
    label { font-size: 0.8rem; color: var(--muted); }
    input, select { background: #0f172a; border: 1px solid #334155; color: var(--text); padding: 10px; border-radius: 6px; outline: none; }
    
    .btn { background: var(--accent); color: white; border: none; padding: 10px; border-radius: 6px; cursor: pointer; font-weight: 600; }
    .btn:hover { background: var(--accent-hover); }
    .btn-secondary { background: #334155; }
    
    .block-list { list-style: none; display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
    .block-item { background: #0f172a; padding: 10px; border-radius: 6px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #334155; }
    .block-actions { display: flex; gap: 4px; }
    .btn-sm { padding: 4px 8px; font-size: 0.75rem; border: none; border-radius: 4px; cursor: pointer; color: white; }
    
    .toast { position: fixed; bottom: 20px; background: var(--success); color: white; padding: 10px 20px; border-radius: 8px; opacity: 0; transition: opacity 0.3s; pointer-events: none; }
    .toast.show { opacity: 1; }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>CICLO DE ESTUDOS</h1>
      <button class="btn-icon" id="toggleConfigBtn">⚙ Configurar</button>
    </header>

    <!-- Tela Principal do Dia a Dia -->
    <main class="main-card" id="mainCard">
      <span class="tag" id="blockType">Carregando...</span>
      <h2 class="current-title" id="blockTitle">---</h2>
      <p class="current-desc" id="blockDesc">---</p>

      <!-- Track do Botão Deslizante -->
      <div class="swipe-container" id="swipeTrack">
        <span class="swipe-text">ARRASTE PARA CONCLUIR ➔</span>
        <div class="swipe-handle" id="swipeHandle">➔</div>
      </div>

      <div class="next-up" id="nextBlockText">Próximo: ---</div>
    </main>

    <!-- Painel de Configurações -->
    <section class="config-panel" id="configPanel">
      <h3>Adicionar / Editar Bloco</h3>
      <div class="form-group">
        <label>Matéria / Título</label>
        <input type="text" id="inputTitle" placeholder="Ex: Direito Constitucional">
      </div>
      <div class="form-group">
        <label>Tipo</label>
        <select id="inputType">
          <option value="Teoria">Teoria</option>
          <option value="Revisão">Revisão</option>
          <option value="Questões">Questões</option>
        </select>
      </div>
      <div class="form-group">
        <label>Observação / Meta (opcional)</label>
        <input type="text" id="inputDesc" placeholder="Ex: Ler cap. 3 ou Fazer 20 questões">
      </div>
      <button class="btn" id="addBlockBtn">Adicionar à Fila</button>

      <h3 style="margin-top: 10px;">Fila do Ciclo</h3>
      <ul class="block-list" id="blockList"></ul>

      <button class="btn btn-secondary" id="saveConfigBtn" style="margin-top: 15px;">Salvar e Fechar Configurações</button>
    </section>
  </div>

  <div class="toast" id="toast">Bloco Concluído!</div>

  <script>
    // ==========================================
    // DEFLA SEUS DADOS DO JSONBIN AQUI:
    // ==========================================
    const BIN_ID = "6aa628e7ac6210605ac6c2cc"; 
    const X_MASTER_KEY = "$2a$10$7dVyC01WDjHJMWMUJIlfL.nhEeLVzYj29Efwck45r8on6hGiq20L6";
    // ==========================================

    // --- ESTADO DA APLICAÇÃO ---
    let store = {
      currentIndex: 0,
      blocks: [
        { id: 1, title: 'Matemática', type: 'Teoria', desc: 'Capítulo 1' },
        { id: 2, title: 'Português', type: 'Questões', desc: '30 questões de crase' }
      ]
    };

    // --- ELEMENTOS DOM ---
    const toggleConfigBtn = document.getElementById('toggleConfigBtn');
    const configPanel = document.getElementById('configPanel');
    const mainCard = document.getElementById('mainCard');
    const saveConfigBtn = document.getElementById('saveConfigBtn');
    
    const blockType = document.getElementById('blockType');
    const blockTitle = document.getElementById('blockTitle');
    const blockDesc = document.getElementById('blockDesc');
    const nextBlockText = document.getElementById('nextBlockText');
    const toast = document.getElementById('toast');

    const inputTitle = document.getElementById('inputTitle');
    const inputType = document.getElementById('inputType');
    const inputDesc = document.getElementById('inputDesc');
    const addBlockBtn = document.getElementById('addBlockBtn');
    const blockList = document.getElementById('blockList');

    // --- INICIALIZAÇÃO ---
    function init() {
      const localData = localStorage.getItem('study_cycle_data');
      if (localData) {
        store = JSON.parse(localData);
      }
      
      if (BIN_ID && X_MASTER_KEY && BIN_ID !== "SEU_BIN_ID_AQUI") {
        fetchFromJSONBin(true);
      } else {
        render();
      }
    }

    // --- RENDERIZAÇÃO ---
    function render() {
      if (store.blocks.length === 0) {
        blockType.textContent = "VAZIO";
        blockTitle.textContent = "Nenhum bloco cadastrado";
        blockDesc.textContent = "Acesse as configurações para adicionar matérias.";
        nextBlockText.textContent = "Próximo: ---";
        return;
      }

      if (store.currentIndex >= store.blocks.length) store.currentIndex = 0;

      const current = store.blocks[store.currentIndex];
      const nextIndex = (store.currentIndex + 1) % store.blocks.length;
      const next = store.blocks[nextIndex];

      blockType.textContent = current.type;
      blockTitle.textContent = current.title;
      blockDesc.textContent = current.desc || '';
      nextBlockText.textContent = `Próximo: [${next.type}] ${next.title}`;

      renderConfigList();
    }

    function renderConfigList() {
      blockList.innerHTML = '';
      store.blocks.forEach((b, index) => {
        const li = document.createElement('li');
        li.className = 'block-item';
        li.innerHTML = `
          <div>
            <strong>${index + 1}. [${b.type}] ${b.title}</strong>
            <div style="font-size: 0.8rem; color: #94a3b8;">${b.desc || ''}</div>
          </div>
          <div class="block-actions">
            <button class="btn-sm" style="background:#334155" onclick="moveBlock(${index}, -1)">▲</button>
            <button class="btn-sm" style="background:#334155" onclick="moveBlock(${index}, 1)">▼</button>
            <button class="btn-sm" style="background:var(--accent)" onclick="duplicateBlock(${index})">📋</button>
            <button class="btn-sm" style="background:var(--danger)" onclick="deleteBlock(${index})">✕</button>
          </div>
        `;
        blockList.appendChild(li);
      });
    }

    // --- INTERAÇÕES DA QUEUE ---
    function advanceQueue() {
      if (store.blocks.length === 0) return;
      store.currentIndex = (store.currentIndex + 1) % store.blocks.length;
      saveLocal();
      syncJSONBin(); // Salva progresso no servidor
      render();
      showToast();
    }

    // --- LÓGICA DO BOTÃO DESLIZANTE (SLIDER) ---
    const swipeTrack = document.getElementById('swipeTrack');
    const swipeHandle = document.getElementById('swipeHandle');
    let isDragging = false;
    let startX = 0;
    let maxDistance = 0;

    function onDragStart(e) {
      if (store.blocks.length === 0) return;
      isDragging = true;
      startX = e.type.includes('touch') ? e.touches[0].clientX : e.clientX;
      maxDistance = swipeTrack.clientWidth - swipeHandle.clientWidth - 8;
      swipeHandle.style.transition = 'none';
    }

    function onDragMove(e) {
      if (!isDragging) return;
      const currentX = e.type.includes('touch') ? e.touches[0].clientX : e.clientX;
      let delta = currentX - startX;
      
      if (delta < 0) delta = 0;
      if (delta > maxDistance) delta = maxDistance;

      swipeHandle.style.left = (delta + 4) + 'px';

      if (delta >= maxDistance) {
        isDragging = false;
        swipeHandle.style.left = (maxDistance + 4) + 'px';
        swipeHandle.style.background = 'var(--success)';
        setTimeout(() => {
          advanceQueue();
          resetSwipe();
        }, 150);
      }
    }

    function onDragEnd() {
      if (!isDragging) return;
      isDragging = false;
      resetSwipe();
    }

    function resetSwipe() {
      swipeHandle.style.transition = 'left 0.2s ease, background 0.2s';
      swipeHandle.style.left = '4px';
      swipeHandle.style.background = 'var(--accent)';
    }

    swipeHandle.addEventListener('mousedown', onDragStart);
    window.addEventListener('mousemove', onDragMove);
    window.addEventListener('mouseup', onDragEnd);

    swipeHandle.addEventListener('touchstart', onDragStart);
    window.addEventListener('touchmove', onDragMove);
    window.addEventListener('touchend', onDragEnd);

    // --- GERENCIAMENTO DE CONFIGURAÇÃO ---
    addBlockBtn.addEventListener('click', () => {
      const title = inputTitle.value.trim();
      if (!title) return;

      store.blocks.push({
        id: Date.now(),
        title: title,
        type: inputType.value,
        desc: inputDesc.value.trim()
      });

      inputTitle.value = '';
      inputDesc.value = '';
      renderConfigList();
    });

    window.moveBlock = function(index, direction) {
      const newIndex = index + direction;
      if (newIndex < 0 || newIndex >= store.blocks.length) return;
      const temp = store.blocks[index];
      store.blocks[index] = store.blocks[newIndex];
      store.blocks[newIndex] = temp;
      renderConfigList();
    };

    window.duplicateBlock = function(index) {
      const item = store.blocks[index];
      store.blocks.splice(index + 1, 0, { ...item, id: Date.now() });
      renderConfigList();
    };

    window.deleteBlock = function(index) {
      store.blocks.splice(index, 1);
      if (store.currentIndex >= store.blocks.length) store.currentIndex = 0;
      renderConfigList();
    };

    // --- SINCRONIZAÇÃO E ARMAZENAMENTO ---
    function saveLocal() {
      localStorage.setItem('study_cycle_data', JSON.stringify(store));
    }

    function syncJSONBin() {
      if (!BIN_ID || !X_MASTER_KEY || BIN_ID === "SEU_BIN_ID_AQUI") return;

      fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
        method: 'PUT',
        headers: {
          'Content-Type': 'application/json',
          'X-Master-Key': X_MASTER_KEY
        },
        body: JSON.stringify({
          currentIndex: store.currentIndex,
          blocks: store.blocks
        })
      }).catch(err => console.error("Erro ao salvar no JSONBin:", err));
    }

    function fetchFromJSONBin(silent = false) {
      if (!BIN_ID || !X_MASTER_KEY || BIN_ID === "SEU_BIN_ID_AQUI") return;

      fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
        headers: { 'X-Master-Key': X_MASTER_KEY }
      })
      .then(res => res.json())
      .then(data => {
        if (data.record) {
          store.currentIndex = data.record.currentIndex || 0;
          store.blocks = data.record.blocks || [];
          saveLocal();
          render();
          if (!silent) alert("Dados carregados com sucesso do servidor!");
        }
      })
      .catch(err => {
        console.error("Erro ao carregar do JSONBin:", err);
        render();
      });
    }

    // Ações da Interface de Configurações
    toggleConfigBtn.addEventListener('click', () => {
      const isOpen = configPanel.classList.contains('open');
      if (isOpen) {
        configPanel.classList.remove('open');
        mainCard.style.display = 'flex';
        toggleConfigBtn.textContent = '⚙ Configurar';
      } else {
        configPanel.classList.add('open');
        mainCard.style.display = 'none';
        toggleConfigBtn.textContent = '✕ Fechar';
      }
    });

    saveConfigBtn.addEventListener('click', () => {
      saveLocal();
      syncJSONBin(); // Salva no servidor apenas ao concluir a configuração para economizar chamadas
      render();

      configPanel.classList.remove('open');
      mainCard.style.display = 'flex';
      toggleConfigBtn.textContent = '⚙ Configurar';
    });

    function showToast() {
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2000);
    }

    // Inicializar
    init();
  </script>
</body>
</html>
